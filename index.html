<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QuickVoucher | Hotspot Voucher Generator</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/voucher.css">
</head>
<body>

    <!-- Header -->
    <header class="app-header">
        <div class="header-inner">
            <div class="brand-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/>
                    <path d="M13 5v2"/>
                    <path d="M13 17v2"/>
                    <path d="M13 11v2"/>
                </svg>
            </div>
            <div>
                <h1 class="brand-name">QuickVoucher</h1>
                <p class="brand-tagline">Hotspot Voucher Generator</p>
            </div>
        </div>
    </header>

    <div class="main-container">

        <!-- Generator Card -->
        <div class="qv-card">
            <form id="rst">

                <!-- Basic Settings -->
                <div class="section">
                    <h6 class="section-title">Basic Settings</h6>
                    <div class="row g-3">
                        <div class="col-12 col-md-5">
                            <label class="form-label" for="Vendo">Tag Name</label>
                            <input class="form-control" id="Vendo" placeholder="Your brand name" maxlength="14">
                        </div>
                        <div class="col-6 col-md-3">
                            <label class="form-label" for="Prefix">Prefix <span class="hint">(max 3)</span></label>
                            <input class="form-control" id="Prefix" placeholder="e.g. P5" maxlength="3">
                        </div>
                        <div class="col-6 col-md-2">
                            <label class="form-label" for="Length">Length</label>
                            <select class="form-select" id="Length">
                                <option value="6" selected>6</option>
                                <option value="7">7</option>
                                <option value="8">8</option>
                                <option value="9">9</option>
                                <option value="10">10</option>
                            </select>
                        </div>
                        <div class="col-12 col-md-2">
                            <label class="form-label" for="char">Characters</label>
                            <select class="form-select" id="char">
                                <option value="1" selected>A3B2C5</option>
                                <option value="2">abcdef</option>
                                <option value="3">123456</option>
                                <option value="4">ABCDEF</option>
                                <option value="5">aBcDef</option>
                                <option value="6">aBc234</option>
                            </select>
                        </div>
                    </div>
                    <div class="row g-3 mt-1">
                        <div class="col-12 col-md-4">
                            <label class="form-label">Auth Type</label>
                            <div class="btn-group w-100 type-toggle" role="group">
                                <input class="btn-check" id="userpass" type="radio" name="btnradio" autocomplete="off">
                                <label class="btn btn-outline-primary" for="userpass">User + Pass</label>
                                <input class="btn-check" id="useronly" type="radio" name="btnradio" autocomplete="off" checked>
                                <label class="btn btn-outline-primary" for="useronly">User Only</label>
                            </div>
                        </div>
                        <div class="col-6 col-md-4">
                            <label class="form-label" for="Price">Price</label>
                            <input class="form-control" id="Price" placeholder="0" min="0" value="0" type="number">
                        </div>
                        <div class="col-6 col-md-4">
                            <label class="form-label" for="Quantity">Quantity</label>
                            <input class="form-control" id="Quantity" placeholder="pcs" min="1" max="5000" type="number" value="3">
                        </div>
                    </div>
                </div>

                <!-- Time & Data -->
                <div class="section">
                    <h6 class="section-title">Time & Data</h6>
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label">Duration <span class="hint">limit-uptime</span></label>
                            <div class="duration-group">
                                <input class="form-control" id="LDays" placeholder="Days" min="0" max="31" type="number">
                                <input class="form-control" id="LHours" placeholder="Hours" min="0" max="59" type="number">
                                <input class="form-control" id="LMinutes" placeholder="Minutes" min="0" max="59" type="number">
                            </div>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Validity <span class="optional">Optional</span></label>
                            <div class="duration-group">
                                <input class="form-control" id="VDays" placeholder="Days" min="0" max="31" type="number">
                                <input class="form-control" id="VHours" placeholder="Hours" min="0" max="59" type="number">
                                <input class="form-control" id="VMinutes" placeholder="Minutes" min="0" max="59" type="number">
                            </div>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Data Package <span class="optional">Optional &mdash; e.g. 500M, 2G</span></label>
                            <input class="form-control" id="Data" placeholder="e.g. 500M, 2G, 5G" value="0">
                        </div>
                    </div>
                </div>

                <!-- Server Configuration -->
                <div class="section">
                    <h6 class="section-title">Server Configuration</h6>
                    <div class="row g-3">
                        <div class="col-12 col-md-4">
                            <label class="form-label">User Profile <span class="optional">Optional</span></label>
                            <input class="form-control" id="Profile" placeholder="default" value="default">
                        </div>
                        <div class="col-12 col-md-4">
                            <label class="form-label">Hotspot Server <span class="optional">Optional</span></label>
                            <input class="form-control" id="Server" placeholder="all" value="all">
                        </div>
                        <div class="col-12 col-md-4">
                            <label class="form-label">Hotspot IP <span class="hint">For login URL</span></label>
                            <input class="form-control" id="ip" placeholder="10.0.0.1" value="">
                        </div>
                    </div>
                </div>

            </form>

            <!-- Actions -->
            <div class="actions-bar">
                <button class="btn btn-generate" onclick="Generate()">Generate Vouchers</button>
                <div class="actions-row">
                    <button class="btn btn-outline-primary" onclick="copyCode()">Copy Script</button>
                    <a class="btn btn-outline-primary" onclick="DownloadScript()" role="button">Download .rsc</a>
                    <button class="btn btn-outline-warning" onclick="printvoucher()">Print</button>
                </div>
                <div class="actions-row">
                    <button class="btn btn-outline-danger" onclick="rst()">Clear All</button>
                    <button class="btn btn-outline-secondary" data-bs-target="#customize" data-bs-toggle="modal">Customize</button>
                </div>
            </div>
        </div>

        <!-- Output Card -->
        <div class="qv-card">
            <div class="output-header">
                <h6 class="output-title">Script Output</h6>
                <span class="total-badge" id="Total"></span>
            </div>
            <div class="code-output" id="OutputCode">
                <code>
                    <span>/ip hotspot user<br></span>
                    <span id="Output"></span>
                </code>
            </div>
        </div>

    </div>

    <!-- Customize Modal -->
    <div class="modal fade" id="customize" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Customize Voucher</h5>
                    <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <!-- Voucher Previews -->
                    <div class="voucher-preview">
                        <div>
                            <table class="voucher" style="width:155px">
                                <tbody>
                                    <tr>
                                        <td style="font-weight:700;border-right:1px solid #ccc;background-color:#ffea8f;-webkit-print-color-adjust:exact;" class="rotate" id="voucher1" rowspan="4">
                                            <span>PHP 200</span>
                                        </td>
                                        <td style="font-weight:700" colspan="2">QuickVoucher</td>
                                    </tr>
                                    <tr>
                                        <td style="width:100%;font-weight:700;font-size:18px;text-align:center">ABC1234</td>
                                    </tr>
                                    <tr>
                                        <td style="font-size:11px">Duration: 1D 2H 3M</td>
                                    </tr>
                                    <tr>
                                        <td style="font-size:12px" colspan="3">Login: <span style="font-weight:700">10.0.0.1</span></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div>
                            <table class="voucher" style="width:200px">
                                <tbody>
                                    <tr>
                                        <td style="font-weight:700;border-right:1px solid #ccc;background-color:#ffea8f;-webkit-print-color-adjust:exact;" class="rotate" id="voucher2" rowspan="4">
                                            <span>PHP 100</span>
                                        </td>
                                        <td style="font-weight:700" colspan="2">QuickVoucher</td>
                                        <td rowspan="3">
                                            <div class="qr-wrapper"><img class="qr-img p-1" src="https://api.qrserver.com/v1/create-qr-code/?size=60x60&data=http://10.0.0.1/login?username=ABC1234"></div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td style="width:100%;font-weight:700;font-size:18px;text-align:center">ABC1234</td>
                                    </tr>
                                    <tr>
                                        <td style="font-size:11px">Duration: 1D 2H 3M</td>
                                    </tr>
                                    <tr>
                                        <td style="font-size:12px" colspan="3">Login: <span style="font-weight:700">10.0.0.1</span></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Customization Controls -->
                    <div class="row g-3">
                        <div class="col">
                            <label class="form-label">Currency</label>
                            <input class="form-control" id="currency" placeholder="PHP" value="PHP">
                        </div>
                        <div class="col">
                            <label class="form-label">Tag Color</label>
                            <input class="form-control" id="TagColor" type="color" value="#ffea8f">
                        </div>
                        <div class="col-auto d-flex flex-column justify-content-end gap-2">
                            <div class="form-check form-switch">
                                <input class="form-check-input" id="qrcodebtn" type="checkbox">
                                <label class="form-check-label" for="qrcodebtn">QR Code</label>
                            </div>
                            <button class="btn btn-primary btn-sm" onclick="color()" type="button">Apply</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden Print Body -->
    <div style="display:none">
        <div id="PrintBody"></div>
    </div>

    <footer class="app-footer">QuickVoucher v2.0</footer>

    <script src="js/jquery-3.6.0.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/generate.js"></script>
</body>
</html>
