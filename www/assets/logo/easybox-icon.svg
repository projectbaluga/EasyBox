<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- EasyBox App Icon: Rounded square with box + Wi-Fi -->

  <!-- Background rounded square -->
  <rect x="0" y="0" width="192" height="192" rx="40" ry="40" fill="#2ECC71"/>

  <!-- Box body -->
  <path d="M46,108 L46,148 C46,154 51,159 57,159 L135,159 C141,159 146,154 146,148 L146,108 Z" fill="#FFFFFF" opacity="0.95"/>

  <!-- Box left flap -->
  <path d="M46,108 L72,88 L38,68 L20,94 Z" fill="#FFFFFF" opacity="0.85"/>

  <!-- Box right flap -->
  <path d="M146,108 L120,88 L154,68 L172,94 Z" fill="#FFFFFF" opacity="0.85"/>

  <!-- Box front rim -->
  <rect x="46" y="105" width="100" height="8" rx="2" fill="#FFFFFF" opacity="0.7"/>

  <!-- Wi-Fi dot -->
  <circle cx="96" cy="82" r="7" fill="#FFFFFF"/>

  <!-- Wi-Fi arc 1 -->
  <path d="M80,68 A22,22 0 0,1 112,68" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>

  <!-- Wi-Fi arc 2 -->
  <path d="M66,54 A42,42 0 0,1 126,54" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>

  <!-- Wi-Fi arc 3 -->
  <path d="M52,40 A62,62 0 0,1 140,40" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
</svg>
